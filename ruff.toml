line-length = 100
target-version = "py310"

[lint]
select = ["F", "E9", "B", "S"]
# The recipe is Python but calibre compiles it from a string; lint it as a module.
[lint.per-file-ignores]
"test_*.py" = ["S101"]   # pytest asserts
"economist_chrome.py" = ["S603"]  # every subprocess call is an argv list; BROWSER_CMD comes from the user's own environment
